
name: Verification de mon projet

on:
  push:
    branches:
      - main

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier les fichiers
        run: |
          test -f index.html
          test -f style.css

      - name: Verifier le titre HTML
        run: |
          grep -q "Bienvenue dans mon premier projet DevOps" index.html
          echo "Le titre HTML est present !"
